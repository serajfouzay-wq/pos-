# Builds the POS Factory generator (the app that makes client POS systems)
# for Windows and Linux and publishes both as a GitHub Release, so it can be
# downloaded and installed on the operator's PC. Run it from the Actions tab
# (Release generator → Run workflow).
#
# The installers are not code-signed: Windows SmartScreen asks once
# ("More info" → "Run anyway").
name: Release generator

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed (shown on the release page)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-generator
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            platform: windows
            bundles: nsis
            output: target/release/bundle/nsis/*.exe
          - name: Linux packages
            os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
            output: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1 # vendored OpenSSL (SQLCipher) assembler
        if: matrix.platform == 'windows'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: generator-${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      # The runner's default shell: on Windows, Git Bash would put its own
      # Perl first, which cannot configure the vendored OpenSSL.
      - name: Build
        run: pnpm --filter @pos/generator tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: generator-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./apps/generator/src-tauri/tauri.conf.json').version")
          tag="generator-v${version}-build.${RUN}"
          {
            echo "POS Factory generator ${version} (build ${RUN})."
            echo
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo "- Windows: download the \`-setup.exe\` and run it. SmartScreen may warn about an unknown publisher: More info, then Run anyway."
            echo "- Linux: the \`.AppImage\` (make it executable, then run it) or the \`.deb\` (Debian/Ubuntu)."
          } > notes.md
          # The artifacts keep their bundle folders (appimage/, deb/): upload files.
          mapfile -t files < <(find dist -type f)
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -ge 3 ] || { echo "::error::expected the Windows and Linux installers"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "POS Factory generator ${version} (build ${RUN})" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
