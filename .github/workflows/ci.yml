name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: TypeScript (format · typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test build
      - run: node --test scripts/*.test.mjs

  edge-functions:
    name: Supabase Edge Functions (Deno check · test)
    runs-on: ubuntu-latest
    env:
      # Keep Deno from adopting the pnpm workspace's package.json.
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-config --allow-read supabase/functions/_shared
      - name: Type-check every function and the local dev router
        run: |
          for fn in license-validate sync-push sync-pull; do
            (cd "supabase/functions/$fn" && deno check --config deno.json index.ts)
          done
          deno check --no-config supabase/functions/dev-server.ts

  cloud:
    name: Cloud sync (SQL tests · live two-till E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK (the POS crate links Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Migrations + LWW / dedupe / isolation / revocation / parity tests.
      - run: ./scripts/test-supabase.sh
      # Real edge functions over HTTP, two tills, sales + stock + LWW converge.
      - run: ./scripts/e2e-sync.sh

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK (Tauri Linux deps, used for CI checks only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (real WMI fingerprint · SQLCipher on MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/setup-nasm@v1 # vendored OpenSSL (SQLCipher) assembler
      - uses: Swatinem/rust-cache@v2
      # The generator is included for its Windows Credential Manager path.
      - run: cargo clippy -p pos-hwid -p pos-hardware -p pos-generator --all-targets -- -D warnings
      # Reads the runner's actual registry + WMI identifiers.
      - run: cargo test -p pos-hwid
      # Includes the Win32 spooler transport (the workspace's only `unsafe`).
      - run: cargo test -p pos-hardware -p pos-license -p pos-client -p pos-generator

  windows-installer:
    name: Windows NSIS installer (${{ matrix.app }})
    # Installers are slow to build; produce them for main and on demand.
    if: github.event_name != 'pull_request'
    needs: [frontend, rust, windows]
    runs-on: windows-latest
    env:
      # Demo installers embed the committed DEVELOPMENT license key (the app
      # shows a warning banner). Client builds from the generator (Phase 5)
      # set POS_LICENSE_PUBLIC_KEY to the real key instead.
      POS_ALLOW_DEV_LICENSE_KEY: '1'
    strategy:
      fail-fast: false
      matrix:
        app: [pos-client, generator]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pos/${{ matrix.app }} tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
