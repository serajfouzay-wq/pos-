# Builds one client's Windows installer. Dispatched by the generator app
# (Builds → Build installer) after it commits `clients/<slug>/`; can also be
# run by hand from the Actions tab.
#
# Updates (Phase 8): with the repository variable POS_UPDATER_PUBLIC_KEY and
# the secrets TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) the build is signed for
# the updater, and with `publish` it is uploaded to the client's Supabase
# project (secret POS_SUPABASE_SERVICE_ROLE_KEY) for the tills to install.
#
# Must exist on the repository's default branch for workflow_dispatch to be
# available.
name: Build client

run-name: Build ${{ inputs.client }} · ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      client:
        description: Client slug (folder under clients/)
        required: true
        type: string
      build_id:
        description: Build id from the generator (names the artifact)
        required: true
        type: string
      version:
        description: Client version (MAJOR.MINOR.PATCH); empty = the app's version
        required: false
        type: string
        default: ''
      notes:
        description: Release notes shown on the tills after they update
        required: false
        type: string
        default: ''
      publish:
        description: Publish the installer to the client's tills as an update
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

concurrency:
  group: build-client-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows installer (${{ inputs.client }})
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Inputs reach scripts only through the environment (never interpolated
      # into shell code).
      CLIENT: ${{ inputs.client }}
      BUILD_ID: ${{ inputs.build_id }}
      POS_CLIENT_VERSION: ${{ inputs.version }}
      POS_RELEASE_NOTES: ${{ inputs.notes }}
      PUBLISH: ${{ inputs.publish }}
      POS_UPDATER_PUBLIC_KEY: ${{ vars.POS_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$CLIENT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#CLIENT} -le 40 ]] \
            || { echo "::error::invalid client slug"; exit 1; }
          [[ "$BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] \
            || { echo "::error::invalid build id"; exit 1; }
          [[ -z "$POS_CLIENT_VERSION" || "$POS_CLIENT_VERSION" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,9}$ ]] \
            || { echo "::error::invalid version"; exit 1; }
          [[ "$PUBLISH" == "true" || "$PUBLISH" == "false" ]] \
            || { echo "::error::publish must be true or false"; exit 1; }
          if [[ "$PUBLISH" == "true" && -z "$POS_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::publishing an update needs the POS_UPDATER_PUBLIC_KEY variable"; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1 # vendored OpenSSL (SQLCipher) assembler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-installer
      - run: pnpm install --frozen-lockfile
      - name: Prepare client build
        id: prepare
        shell: bash
        run: node scripts/prepare-client-build.mjs "$CLIENT"
      - name: Client icons
        if: steps.prepare.outputs.has_icon == 'true'
        shell: bash
        run: >
          pnpm --filter @pos/pos-client exec tauri icon
          "$GITHUB_WORKSPACE/clients/$CLIENT/app-icon.png"
          -o "$GITHUB_WORKSPACE/apps/pos-client/src-tauri/client-icons"
      # POS_CLIENT_CONFIG and POS_LICENSE_PUBLIC_KEY come from the prepare
      # step; build.rs refuses the development key in release builds.
      - name: Build installer
        shell: bash
        env:
          # Signs the update artifact (the `.sig` next to the installer).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @pos/pos-client tauri build --config src-tauri/tauri.client.json
      - uses: actions/upload-artifact@v4
        with:
          name: pos-${{ inputs.client }}-${{ inputs.build_id }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish the update to the tills
        if: inputs.publish == 'true'
        shell: bash
        env:
          POS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POS_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-release.mjs "$CLIENT"
