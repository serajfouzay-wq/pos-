# Builds one client's installers: Windows (NSIS setup) and Linux (AppImage
# and .deb), in parallel, merged into one artifact the generator downloads.
# Dispatched by the generator app (Builds → Build installers) after it
# commits `clients/<slug>/`; can also be run by hand from the Actions tab.
#
# Nothing secret is needed: the till is built to trust the generator's
# update key (`clients/<slug>/updater-public-key.txt`, a public key), and
# the generator signs the installers on its own PC after downloading them.
#
# Must exist on the repository's default branch for workflow_dispatch to be
# available.
name: Build client

run-name: Build ${{ inputs.client }} · ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      client:
        description: Client slug (folder under clients/)
        required: true
        type: string
      build_id:
        description: Build id from the generator (names the artifact)
        required: true
        type: string
      version:
        description: Client version (MAJOR.MINOR.PATCH); empty = the app's version
        required: false
        type: string
        default: ''
      notes:
        description: Release notes (kept by the generator; unused by the build)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-client-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  installer:
    name: ${{ matrix.name }} (${{ inputs.client }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            platform: windows
            bundles: nsis
            output: target/release/bundle/nsis/*.exe
          - name: Linux packages
            os: ubuntu-22.04 # oldest supported glibc: the AppImage runs on more systems
            platform: linux
            bundles: appimage,deb
            output: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    env:
      # Inputs reach scripts only through the environment (never interpolated
      # into shell code).
      CLIENT: ${{ inputs.client }}
      BUILD_ID: ${{ inputs.build_id }}
      POS_CLIENT_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$CLIENT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#CLIENT} -le 40 ]] \
            || { echo "::error::invalid client slug"; exit 1; }
          [[ "$BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] \
            || { echo "::error::invalid build id"; exit 1; }
          [[ -z "$POS_CLIENT_VERSION" || "$POS_CLIENT_VERSION" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,9}$ ]] \
            || { echo "::error::invalid version"; exit 1; }
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1 # vendored OpenSSL (SQLCipher) assembler
        if: matrix.platform == 'windows'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-installer-${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare client build
        id: prepare
        shell: bash
        run: node scripts/prepare-client-build.mjs "$CLIENT"
      - name: Client icons
        if: steps.prepare.outputs.has_icon == 'true'
        shell: bash
        run: >
          pnpm --filter @pos/pos-client exec tauri icon
          "$GITHUB_WORKSPACE/clients/$CLIENT/app-icon.png"
          -o "$GITHUB_WORKSPACE/apps/pos-client/src-tauri/client-icons"
      # POS_CLIENT_CONFIG, POS_LICENSE_PUBLIC_KEY and POS_UPDATER_PUBLIC_KEY
      # come from the prepare step; build.rs refuses the development license
      # key in release builds.
      # The runner's default shell: on Windows, Git Bash would put its own
      # Perl first, which cannot configure the vendored OpenSSL.
      - name: Build
        run: >
          pnpm --filter @pos/pos-client tauri build
          --config src-tauri/tauri.client.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: pos-${{ inputs.client }}-${{ inputs.build_id }}-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  artifact:
    name: One artifact for the generator
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # deletes the per-platform artifacts once merged
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: pos-${{ inputs.client }}-${{ inputs.build_id }}
          pattern: pos-${{ inputs.client }}-${{ inputs.build_id }}-*
          separate-directories: true
          delete-merged: true
          retention-days: 30
