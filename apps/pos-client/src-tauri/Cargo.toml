[package]
name = "pos-client"
description = "POS Factory — offline-first point of sale client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "pos-client"

[lib]
name = "pos_client_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true
