[package]
name = "pos-license"
description = "RS256 license tokens: claims, verification, offline grace, activation requests and (feature `issuer`) signing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Signing + key management. Only the generator enables this; the POS binary
# ships verification code and the public key only.
issuer = ["dep:rand", "pkcs8/encryption"]

[dependencies]
base64.workspace = true
chrono.workspace = true
hex.workspace = true
pkcs8.workspace = true
pos-core.workspace = true
rand = { workspace = true, optional = true }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
rand.workspace = true

[lints]
workspace = true

[[example]]
name = "issue-dev-license"
required-features = ["issuer"]

[dev-dependencies.pos-hwid]
workspace = true
