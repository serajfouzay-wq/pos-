[package]
name = "pos-hardware"
description = "Receipt printers and cash drawers: ESC/POS encoding, receipt layout, TCP / serial (incl. Bluetooth SPP) / Windows spooler transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png.workspace = true
pos-core.workspace = true
serde.workspace = true
serialport = { version = "4", default-features = false }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"]

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true

# Workspace lints forbid `unsafe`; this crate needs it in exactly one module
# (the Win32 spooler FFI), so it inherits everything else explicitly and
# downgrades `unsafe_code` to deny, re-allowed only in `transport::spooler`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
float_arithmetic = "deny"
cast_precision_loss = "deny"
unwrap_used = "warn"
