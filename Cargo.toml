[workspace]
resolver = "2"
members = [
  "crates/pos-core",
  "apps/pos-client/src-tauri",
  "apps/generator/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pos-core = { path = "crates/pos-core" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Money must never touch floating point.
float_arithmetic = "deny"
cast_precision_loss = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
